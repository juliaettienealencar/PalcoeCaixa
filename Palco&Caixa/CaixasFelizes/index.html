<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Pseudo-classes CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Atividade Pseudo-classes CSS</h1>

    <h2>1</h2>
    <div class="palco">
        <div class="caixa vertical" tabindex="0">Caixa</div>
    </div>

    <h2>2</h2>
    <div class="palco">
        <div class="caixa horizontal" tabindex="0">Caixa</div>
    </div>

    <h2>3</h2>
    <div class="palco">
        <div class="caixa diagonal" tabindex="0">Caixa</div>
    </div>

    <h2>4</h2>
    <div class="palco">
        <div class="caixa velocidade" tabindex="0">Caixa</div>
    </div>

    <h2>5</h2>
    <div class="palco">
        <div class="caixa etapas" tabindex="0">Caixa</div>
    </div>

    <h2>6, 7, 8 e 9</h2>
    

    <div class="palco">
        <div class="caixa interativa" tabindex="0">Caixa</div>
    </div>

    <h2>Desafio Extra</h2>
    <div class="palco">
        <div class="caixa desafio" tabindex="0">Caixa</div>
    </div>

</body>
</html>
